<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synthetic X composer fixture</title>
  </head>
  <body>
    <article data-framenest-post data-testid="tweet">
      <a href="https://x.com/fixture/status/123456789">permalink</a>
      <time>now</time>
      <div data-testid="tweetPhoto" data-framenest-media>
        <img alt="" width="120" height="80" />
      </div>
      <div role="group" aria-label="Tweet actions">
        <div>
          <button type="button" data-testid="reply" aria-label="Reply">Reply</button>
        </div>
        <div>
          <button type="button" data-testid="retweet" aria-label="Repost">Repost</button>
        </div>
        <div>
          <button type="button" data-testid="like" aria-label="Like">Like</button>
        </div>
        <div>
          <button type="button" data-testid="bookmark" aria-label="Bookmark">Bookmark</button>
        </div>
        <div>
          <button type="button" aria-label="Share post">Share</button>
        </div>
      </div>
    </article>
    <form data-framenest-composer data-framenest-composer-chrome>
      <div data-framenest-composer-text-row>
        <div
          data-testid="tweetTextarea_0"
          contenteditable="true"
          role="textbox"
          aria-label="Post your reply"
        ></div>
      </div>
      <div data-testid="toolBar" data-framenest-composer-toolbar role="toolbar" aria-label="Composer tools">
        <div>
          <button type="button" aria-label="Content disclosure" data-framenest-content-disclosure>
            Everyone
          </button>
        </div>
      </div>
      <input data-framenest-composer-file type="file" accept="image/*,video/mp4" />
      <button type="button" data-testid="tweetButton" id="must-not-click">Post</button>
    </form>
  </body>
</html>
