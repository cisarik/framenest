<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FrameNest companion</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <main>
      <h1>FrameNest</h1>
      <section id="setup">
        <label for="origin">FrameNest origin</label>
        <input id="origin" type="text" spellcheck="false" autocomplete="off" />
        <button id="save-origin" type="button">Connect</button>
        <button id="reset" type="button">Reset</button>
        <p id="setup-status"></p>
      </section>
      <section id="picker" hidden>
        <input id="search" type="search" placeholder="Search titles" />
        <select id="kind">
          <option value="">All kinds</option>
          <option value="image">Image</option>
          <option value="animated_image">GIF-style</option>
          <option value="video">Video</option>
        </select>
        <button id="refresh" type="button">Refresh</button>
        <p id="picker-status"></p>
        <ul id="results"></ul>
      </section>
    </main>
    <script src="../shared/messages.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
