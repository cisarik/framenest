<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to FrameNest</title>
    <link rel="stylesheet" href="save.css" />
  </head>
  <body>
    <main>
      <form id="save-form" autocomplete="off">
        <div class="header">
          <h1>Save to FrameNest</h1>
          <button id="close" type="button" aria-label="Close">X</button>
        </div>
        <div class="fields">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="240" spellcheck="true" />
          <label for="tag-search">Tags</label>
          <input
            id="tag-search"
            name="tag-search"
            type="text"
            maxlength="64"
            spellcheck="false"
            placeholder="Search tags"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="tag-suggestions"
            autocomplete="off"
          />
          <div id="tag-suggestions" class="tag-suggestions" role="listbox"></div>
          <div id="selected-tags" class="selected-tags" aria-live="polite"></div>
          <p id="tags-status" class="status"></p>
          <p id="form-status" class="status" role="status"></p>
        </div>
        <div class="actions">
          <button id="save" type="submit">Save</button>
          <button
            id="analyze"
            class="analyze"
            type="button"
            hidden
            disabled
            title="Analyze by AI is available in FrameNest after this item is saved."
            aria-label="Analyze by AI is available in FrameNest after this item is saved."
          >
            Analyze by AI
          </button>
        </div>
      </form>
    </main>
    <script src="../shared/messages.js"></script>
    <script src="save.js"></script>
  </body>
</html>
